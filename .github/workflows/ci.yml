# Three gates, because `npm test` cannot see a single line of the ~1,100 lines
# of Kotlin and ~1,100 of Swift in this module. FG-0.6.
#
#   js       typecheck + lint + test + web bundle   (FG-7.3, ~2 min)
#   android  Kotlin type-check matrix, then a real Gradle assembleRelease
#            (FG-0.6 steps 1 and 4-5)
#   ios      pod lib lint                          (FG-0.6 step 2)
#
# The android job deliberately runs BOTH halves. `verify:android` is fast and
# catches Kotlin errors, but Gradle aborts at `configureCMakeRelWithDebInfo`
# before Kotlin is ever compiled — so a Kotlin error is invisible while the
# native build is broken, which is exactly how two hard compile errors and a
# false `react-native` floor reached published versions. The Gradle half is what
# covers manifest merging, resource linking, and the CMake/NDK compile.
#
# Node 22, not 20: react-native 0.87 declares
#   "engines": { "node": "^22.13.0 || ^24.3.0 || >= 26.0.0" }
# and npm enforces that on install, so a 20 runner fails in `npm ci` before any
# gate runs — with an engine error that reads like a broken lockfile rather than
# an out-of-date runner. Pinned by major so patch updates keep landing; the
# floor that matters is 22.13.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run, but never cancel a
# run on main — that is where a release is cut from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  js:
    name: js (typecheck, lint, test, web bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck + lint + test + web bundle
        run: npm run verify

  # Proves the gates above are gates. Runs the fast probes only; the Gradle and
  # pod probes need macOS/SDK setup and are run manually via `npm run
  # verify:gates -- --full`, plus once by hand before a release.
  gate-self-test:
    name: gate self-test (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # v4, not v3: v3's default `packages` is "tools platform-tools" and Google
      # no longer serves the legacy `tools` package, so the action dies with
      # `Warning: Failed to find package 'tools'` / exit 1 before any gate runs.
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: install SDK platform
        run: sdkmanager "platforms;android-35"
      - name: cache Kotlin verify artifacts
        uses: actions/cache@v4
        with:
          path: |
            /tmp/omp-kotlin-verify
            ${{ runner.temp }}/omp-kotlin-verify
          key: kotlin-verify-${{ hashFiles('scripts/verify-android-kotlin.mjs') }}
          restore-keys: kotlin-verify-
      - run: npm ci
      - name: every gate goes red on a known-bad input
        run: npm run verify:gates

  android:
    name: android (Kotlin matrix + Gradle assembleRelease)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v4, not v3 — see the gate-self-test job for why. `sdkmanager` is already
      # on PATH from this action; the package list below is all this job needs
      # on top of the `platform-tools` default.
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # Two different platform pins are needed in one job, and getting this wrong
      # is silent-ish (AGP auto-downloads, so the build still works — just 4
      # minutes slower, or fails with a confusing "Failed to find target with
      # hash string 'android-35'" if auto-download is off):
      #
      #   android-34 / build-tools 34.0.0 — what the RN 0.74.7 host template pins
      #     in its buildscript ext. `verify:android:host` scaffolds that template,
      #     and this module reads compileSdkVersion off the host's rootProject.ext.
      #   android-35 — the `PLATFORM` constant in scripts/verify-android-kotlin.mjs,
      #     whose android.jar is the compile classpath for the Kotlin matrix.
      #
      # NDK/CMake are pinned to the same template: the module takes ndkVersion from
      # the host, so a mismatch means it silently falls back to a second NDK —
      # exactly the bug the comment at the top of android/build.gradle is about.
      - name: install SDK platform + NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # The first run downloads the NDK (~2 GB), CMake and every media3 AAR. An
      # uncached job is the kind of timeout that gets disabled "temporarily" and
      # then forgotten, so both caches are load-bearing.
      - name: cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/build.gradle') }}-${{ runner.os }}
          restore-keys: gradle-android-${{ runner.os }}

      # verify:android caches resolved jars in os.tmpdir(); cache both spellings
      # because the runner's TMPDIR is not guaranteed to be /tmp.
      - name: cache Kotlin verify artifacts
        uses: actions/cache@v4
        with:
          path: |
            /tmp/omp-kotlin-verify
            ${{ runner.temp }}/omp-kotlin-verify
          key: kotlin-verify-${{ hashFiles('scripts/verify-android-kotlin.mjs') }}
          restore-keys: kotlin-verify-

      - run: npm ci

      - name: Kotlin type-check across the RN version matrix
        run: npm run verify:android

      # Scaffolds a throwaway RN host app, autolinks this module into it, and
      # runs `:<nameCleansed>:assembleRelease`, where the autolinker derives the
      # Gradle project name from the package name (a scope becomes a `_` prefix,
      # so `@obsidian_north/media-player` -> `:obsidian_north_media-player`).
      # Needs the app: the module
      # resolves ndkVersion/compileSdkVersion/ABIs from rootProject.ext, so it
      # cannot be built standalone.
      - name: Gradle assembleRelease in a host app
        run: npm run verify:android:host

      # An NDK/CMake failure here is usually a real finding, not flake, because
      # the AAR assertion in the script catches a build that exits 0 without
      # producing one.
      - name: upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ~/.gradle/daemon/**/*.log
          if-no-files-found: ignore

  ios:
    name: ios (pod lib lint)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner ships a CocoaPods, but not a predictable one. Pinning it keeps
      # a pod lint from going red because of a lint change upstream.
      - name: install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}
          restore-keys: cocoapods-${{ runner.os }}

      # Both steps below need node_modules, so this is not optional setup:
      #   - `verify:ios` resolves `@react-native/codegen` out of node_modules and
      #     dies at startup with "Cannot load @react-native/codegen" without it,
      #     which is a false red that says nothing about the iOS sources;
      #   - `pod lib lint` resolves React-Core / React-Codegen / React-RCTFabric
      #     from node_modules/react-native, and the podspec reads package.json
      #     for its version.
      # Every other job in this workflow already installs first; this one did
      # not, and the gate it runs is the whole point of the job.
      - run: npm ci

      # Codegen cross-check first, and it is not just `pod lib lint` padding.
      # The iOS half of Wave 3 was four separate hard build failures that no
      # other gate could see, because nothing compiled Swift until now: a
      # protocol name codegen never emits (`ObsidianAudioSpec` vs
      # `NativeObsidianAudioSpec`), a podspec naming a pod that does not exist
      # (`ReactCodegen`), eight video commands with no `RCT_EXPORT_METHOD`, and
      # a bridging header importing an Objective-C++-only header. Runs on
      # ubuntu in the `verify` job too; repeated here so a macOS-only red has
      # a cheap explanation. See to-be-done.md FG-3.1.
      - name: codegen / native registration cross-check
        run: npm run verify:ios

      - name: pod lib lint
        run: npm run verify:ios:pod
