buildscript {
    ext.getExtOrDefault = { name ->
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ObsidianMediaPlayer_" + name]
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        // The version of Kotlin used here must match the version used by the
        // consuming app (Lumora uses Kotlin 2.1.20). The react-native-gradle-plugin
        // resolves `kotlinVersion` from the root project when available (Expo's
        // android template defines it); the fallback only applies if it is missing.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion') ?: '2.1.20'}")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

android {
    namespace = "com.obsidianmediaplayer"
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())

        externalNativeBuild {
            cmake {
                cppFlags "-O2", "-frtti", "-fexceptions", "-Wall", "-Werror", "-std=c++17"
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures { buildConfig = true }
}

// React Native Codegen integration. This block is what makes the
// `react-native-gradle-plugin` run Codegen for this library during the app
// build and generate:
//   android/build/generated/source/codegen/jni/  (Fabric component JNI)
//   android/build/generated/source/codegen/java/  (TurboModule Java specs)
// Without it, the app-level CMake step fails with:
//   "add_subdirectory given source .../obsidian-media-player/android/build/
//    generated/source/codegen/jni/ which is not an existing directory"
// and "Cannot specify link libraries for target react_codegen_ObsidianMediaPlayerSpec".
react {
    jsRootDir = file("../../")
    libraryName = "ObsidianMediaPlayerSpec"
    codegenJavaPackageName = "com.obsidianmediaplayer"
}

dependencies {
    implementation("com.facebook.react:react-native:+")
    implementation("androidx.media3:media3-exoplayer:1.3.1")
    implementation("androidx.media3:media3-session:1.3.1")
    implementation("androidx.media3:media3-exoplayer-dash:1.3.1")
    implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
    implementation("androidx.core:core:1.12.0")
    implementation("androidx.media:media:1.7.0")
}
